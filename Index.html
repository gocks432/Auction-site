<!doctype html><html lang="ko"><head><meta charset="UTF-8"><base target="_top"><style>
:root{color-scheme:light;--blue:#2362ad;--ink:#24334b;--soft:#e0eef8}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:14px/1.6 Arial,'Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d5dfeb;border-radius:9px;background:white;color:var(--ink);padding:10px 15px;min-height:42px}button:hover{filter:brightness(.96)}button:disabled{opacity:.55;cursor:default}input:not([type=checkbox]):not([type=radio]),select,textarea{display:block;width:100%;padding:11px;border:1px solid #ccd9e8;border-radius:9px;margin-top:6px;color:var(--ink);background:white;min-width:0}input[type=checkbox],input[type=radio]{accent-color:#2463ed}label{display:block;color:#52627a;font-size:13px}h1{font-size:25px;margin:0 0 5px}h2{font-size:18px;margin:0 0 13px}h3{font-size:16px;margin:8px 0}p{margin:6px 0}header{background:var(--blue);color:white;padding:15px 24px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-weight:800;font-size:22px}.blue{background:#2463ed;color:white;border-color:#2463ed}.danger{color:#b43c34}.shell{display:grid;grid-template-columns:205px minmax(0,1fr);max-width:1550px;margin:auto;min-height:85vh}aside{background:white;padding:27px 14px}aside .school{text-align:center;padding:0 0 24px;border-bottom:1px solid #e5ebf3;margin-bottom:20px}nav{display:grid;gap:8px}nav button{text-align:left;border:0}nav .selected{background:#dceaff;color:#1857b9;font-weight:700}main{padding:28px;min-width:0}.panel,.product{background:white;border:1px solid #dce4ee;border-radius:15px;padding:23px;box-shadow:0 2px 3px #26364c07;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.full{grid-column:1/-1}.muted{color:#718198;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end;margin-top:17px}.wallet{background:#101a31;color:white;padding:25px;border-radius:15px;margin:20px 0;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.wallet .muted{color:#b1c0d8}.big{font-size:32px;font-weight:800;color:#ffdb81}.walletstat{background:#ffffff0b;padding:15px;border-radius:12px;min-width:150px}.walletstat b{display:block;font-size:18px}.avatar{width:70px;height:80px;object-fit:contain;background:#eef3ff;border-radius:12px}.tag{display:inline-block;padding:4px 8px;border-radius:6px;background:#eaf2ff;color:#285eab;font-size:12px}.green{background:#e1f6ec;color:#117d56}.art{height:140px;background:#eaf2ff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden;margin-bottom:12px}.art img{width:100%;height:100%;object-fit:contain}.product{padding:16px;margin:0}.product .desc{white-space:pre-wrap;font-size:13px;min-height:42px;color:#66788e}.amount{font-size:23px;font-weight:800;margin:10px 0}.timer{background:#fff0e4;color:#b65021;padding:5px 9px;border-radius:6px;font-size:13px;display:inline-block}.notice{background:white;border-left:4px solid var(--blue);padding:13px 17px;border-radius:10px;margin:20px 0}.message{background:#e9f5ef;color:#246541;padding:12px 16px;border-radius:10px;white-space:pre-wrap}.error{background:#fff0ee;color:#9e3830}.login{max-width:470px;margin:45px auto;padding:30px}.login label{margin:15px 0}.login h1{text-align:center}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1}.top-actions{display:flex;align-items:center;gap:10px}.top-actions button{padding:5px 12px;min-height:35px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:11px 8px;border-bottom:1px solid #e4ebf4;text-align:left}th{background:#f7faff;color:#6c7d94;font-weight:500}td input{min-width:90px!important}.upload{background:#f5f9ff;border:2px dashed #bfd3ec;border-radius:12px;padding:22px;margin:18px 0}.line{padding:14px 0;border-bottom:1px solid #e7edf5}.hide,[hidden]{display:none!important}.checks{display:flex;flex-wrap:wrap;gap:12px}.check{background:#f2f6fb;border-radius:8px;padding:8px 12px}dialog{border:0;border-radius:15px;padding:25px;width:min(460px,95%);color:var(--ink)}dialog::backdrop{background:#10254170}#status{max-width:1100px;margin:10px auto;padding:0 15px}#status:empty{display:none}#busy{font-size:12px;color:#c7e0ff}.login .brandicon{text-align:center;font-size:45px}.copyright{font-size:11px;color:#8c99ac;text-align:center;padding:15px}.progress-title{font-size:13px;color:#3d6ba2;margin-bottom:16px}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{padding:10px 15px}aside .school{display:none}nav{display:flex;flex-wrap:wrap;gap:4px}nav button{padding:8px 11px}main{padding:18px}.formgrid{grid-template-columns:1fr}.login{margin:20px auto}header{padding:13px 17px}.wallet{padding:18px}.big{font-size:28px}input,select,textarea{font-size:16px!important}}@media(prefers-reduced-motion:no-preference){button{transition:filter .15s}}
</style></head><body>
<header><div class="brand">⚒ 우리 반 GOLD 경매장</div><div class="top-actions"><span id="busy" role="status"></span><span id="who"></span><button id="logout" hidden>로그아웃</button></div></header><div id="status" role="status" aria-live="polite"></div><div id="root"></div><dialog id="confirm"><h2 id="confirm-title">확인</h2><p id="confirm-text"></p><div class="actions"><button id="confirm-no">돌아가기</button><button id="confirm-yes" class="blue">확인</button></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>Number(n||0).toLocaleString('ko-KR');
let token=sessionStorage.getItem('gold-token')||'',data=null,view='market',loginRole='student',busy=false,pending=null,offset=0,importRows=[],imageCache={},pollTimer;
function rid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2);}
function call(action,p={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r.ok?resolve(r.data):reject(new Error(r.error))).withFailureHandler(e=>{e.transport=true;reject(e);}).api(action,token,p));}
function message(text,error=false){$('#status').innerHTML='<div class="message '+(error?'error':'')+'">'+esc(text)+'</div>';}
function working(on){busy=on;$('#busy').textContent=on?'처리 중…':'';document.querySelectorAll('button[data-mutate]').forEach(b=>b.disabled=on);}
async function mutate(action,p){if(busy)return false;working(true);p.requestId=p.requestId||rid();pending={action,p};try{data=await call(action,p);pending=null;offset=data.serverNow-Date.now();render();message('저장되었습니다.');return true;}catch(e){message(e.message,true);if(e.transport){$('#status').insertAdjacentHTML('beforeend','<button id="retry">같은 요청 다시 시도</button>');$('#retry').onclick=()=>{const q=pending;if(q)mutate(q.action,q.p);};}else pending=null;return false;}finally{working(false);}}
async function refresh(redraw=true){if(busy||!token)return;working(true);try{data=await call('snapshot');offset=data.serverNow-Date.now();if(redraw)render();}catch(e){message(e.message,true);if(/로그인|계정이 변경|비밀번호가 변경/.test(e.message))signoutLocal();}finally{working(false);}}
function signoutLocal(){token='';data=null;imageCache={};sessionStorage.removeItem('gold-token');$('#logout').hidden=true;$('#who').textContent='';showLogin();}
function showLogin(){ $('#root').innerHTML=`<section class="panel login"><div class="brandicon">🏫</div><h1>우리 반 경매장</h1><p class="muted" style="text-align:center">내 아바타와 함께하는 GOLD 마켓</p><div class="tabs"><button id="student-tab" class="${loginRole==='student'?'blue':''}">학생 로그인</button><button id="teacher-tab" class="${loginRole==='teacher'?'blue':''}">교사 로그인</button></div><form id="login-form">${loginRole==='student'?'<label>학생 코드<input name="code" autocomplete="username" required maxlength="32"></label>':''}<label>${loginRole==='teacher'?'교사 비밀번호':'PIN 비밀번호'}<input name="password" type="password" ${loginRole==='student'?'inputmode="numeric"':''} autocomplete="current-password" required maxlength="128"></label><button class="blue" type="submit" style="width:100%">${loginRole==='teacher'?'교사 화면 열기':'로그인'}</button></form><p class="muted" style="margin-top:18px">${loginRole==='teacher'?'교사가 설정한 비밀번호로만 관리 화면에 접속할 수 있습니다.':'선생님이 나누어 준 학생 코드와 PIN을 입력하세요.'}</p></section>`;$('#student-tab').onclick=()=>{loginRole='student';showLogin();};$('#teacher-tab').onclick=()=>{loginRole='teacher';showLogin();};$('#login-form').onsubmit=async e=>{e.preventDefault();if(busy)return;working(true);const f=new FormData(e.target);try{const r=await call('login',{role:loginRole,code:f.get('code'),password:f.get('password')});token=r.token;sessionStorage.setItem('gold-token',token);view=r.role==='teacher'?'manage':'market';data=await call('snapshot');offset=data.serverNow-Date.now();render();$('#status').textContent='';}catch(err){message(err.message,true);}finally{working(false);}};}
function labelStatus(a){return a.status==='draft'?'시작 대기':a.status==='cancelled'?'취소됨':a.status==='closed'?'종료':a.start>Date.now()+offset?'예정':'진행 중';}
function time(t){return new Date(t).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function title(t,sub){return '<div class="row"><div><h1>'+esc(t)+'</h1><p class="muted">'+esc(sub)+'</p></div><span class="tag">우리 반 GOLD</span></div>';}
function render(){if(!data)return showLogin();const teacher=data.role==='teacher';$('#logout').hidden=false;$('#who').textContent=teacher?'교사':data.me.name;let links=teacher?[['manage','⚒ 경매 관리'],['create','✚ 경매 만들기'],['screen','▣ 학급 화면'],['accounts','♙ 학생 · 계정'],['gold','🪙 GOLD 관리'],['coupons','🎟 쿠폰 관리'],['settings','⚙ 설정 · 백업']]:[['market','⚒ 경매장'],['wallet','🪙 내 GOLD'],['coupons','🎟 내 쿠폰함'],['history','☷ 참여 기록']];if(!links.some(x=>x[0]===view))view=links[0][0];$('#root').innerHTML='<div class="shell"><aside><div class="school"><div style="font-size:36px">🏫</div><b>우리 반 경매장</b><p class="muted">'+(teacher?'교사 관리 공간':'함께 배우는 경제 생활')+'</p></div><nav>'+links.map(([v,t])=>'<button data-nav="'+v+'" class="'+(v===view?'selected':'')+'">'+t+'</button>').join('')+'</nav></aside><main id="main"></main></div>';let html='';
if(view==='market'){const me=data.me;html=title('오늘의 경매장','쿠폰의 조건을 읽고, 신중하게 입찰해요.')+`<section class="wallet">${me.avatar?'<img class="avatar" data-image="'+esc(me.avatar)+'" alt="내 아바타">':'<div style="font-size:42px">🧙</div>'}<div><div>${esc(me.name)} 님, 반가워요!</div><div class="muted">사용 가능한 GOLD</div><div class="big">${fmt(me.balance-me.held)} <small style="font-size:14px">GOLD</small></div></div><div class="walletstat"><span class="muted">보유 GOLD</span><b>${fmt(me.balance)}</b></div><div class="walletstat"><span class="muted">입찰에 묶인 GOLD</span><b>${fmt(me.held)}</b></div></section><div class="notice">📣 낙찰될 때만 GOLD가 차감됩니다. 비공개 입찰 금액은 마감까지 나만 볼 수 있어요.</div><div class="grid">${data.auctions.slice().reverse().map(product).join('')||'<div class="panel">아직 등록된 경매가 없어요.</div>'}</div>`;}
if(view==='manage'){html=title('경매 관리','마감은 서버 시각 기준 · 종료된 경매는 자동 정산됩니다.')+'<div class="actions"><button data-nav="create" class="blue">+ 새 경매 만들기</button><button id="refresh">새로고침</button></div><div class="grid" style="margin-top:18px">'+(data.auctions.slice().reverse().map(product).join('')||'<div class="panel">첫 경매를 만들어 보세요.</div>')+'</div>';}
if(view==='screen'){html=title('우리 반 경매 시간','쿠폰과 남은 시간을 함께 확인해요.')+'<div class="grid" style="margin-top:22px">'+(data.auctions.filter(a=>a.status==='open').map(a=>'<section class="panel"><span class="tag">'+(a.mode==='public'?'공개 경매':'비공개 경매')+'</span><h1 style="margin-top:15px">'+esc(a.title)+'</h1><p>'+esc(a.description)+'</p><div class="big" style="color:#235fa5;margin:25px 0" data-start="'+a.start+'" data-end="'+a.end+'"></div><h2>'+(a.mode==='public'?fmt(a.highest||a.minimum)+' GOLD':'마감까지 금액 비공개')+'</h2></section>').join('')||'<section class="panel">진행 중인 경매가 없습니다.</section>')+'</div>'; }
if(view==='create'){html=title('새 경매 만들기','보상과 규칙을 정한 뒤 등록하세요.')+`<form id="create-form" style="margin-top:20px"><section class="panel"><h2>01　어떤 보상을 줄까요?</h2><div class="formgrid"><label>보상 선택<select id="reward"><option>급식당번 면제권</option><option>숙제 면제권</option><option>추가 간식</option><option>직접 입력</option></select></label><label>경매 이름<input name="title" id="reward-name" value="급식당번 면제권" required maxlength="80"></label><label class="full">설명 · 사용 조건<textarea name="description" rows="3" maxlength="1500" required>선생님과 날짜를 정한 뒤 1회 사용할 수 있어요.</textarea></label><label>사용 기한 · 낙찰일부터 며칠<input name="validDays" type="number" min="1" max="365" value="14" required></label><label>쿠폰 이미지 · PNG/JPG/WebP<input id="coupon-image" type="file" accept="image/png,image/jpeg,image/webp"></label></div></section><section class="panel"><h2>02　진행 규칙</h2><div class="formgrid"><label>경매 방식<select name="mode"><option value="public">공개 · 최고 금액 표시</option><option value="sealed">비공개 · 마감까지 숨김</option></select></label><label>시간 설정<select id="timing" name="timing"><option value="duration">시작 버튼을 누른 뒤 몇 분간</option><option value="scheduled">시작 · 종료 시각 지정</option></select></label><label>시작 금액 · GOLD<input name="minimum" type="number" min="1" max="100000000" value="100" required></label><label>입찰 단위 · GOLD<input name="step" type="number" min="1" max="100000000" value="10" required></label><label id="duration">진행 시간 · 분<input name="minutes" type="number" min="1" max="1440" value="5" required></label><div class="formgrid full" id="schedule" hidden><label>시작 · 한국 시간<input name="start" type="datetime-local"></label><label>종료 · 한국 시간<input name="end" type="datetime-local"></label></div><div class="full"><label>참여 학생 · 선택하지 않으면 전체</label><div class="checks">${data.students.map(u=>'<label class="check"><input type="checkbox" name="allowed" value="'+esc(u.id)+'"> '+u.number+'번 '+esc(u.name)+'</label>').join('')}</div></div></div><p class="muted" style="margin-top:15px">낙찰자 1명 · 최고가 낙찰 · 동점은 최종 금액 선접수 우선 · 시작 금액 + 입찰 단위의 배수로 입찰</p><div class="actions"><button type="submit" data-mutate class="blue">경매 등록</button></div></section></form>`;}
if(view==='accounts'){html=title('학생 · 로그인 정보','PDF로 계정을 등록하거나 변경해요. GOLD와 쿠폰은 유지됩니다.')+`<section class="panel" style="margin-top:20px"><div class="progress-title">① PDF 업로드　→　② 원본과 대조 · 수정　→　③ 확인한 학생만 적용</div><label class="upload">학생 로그인 PDF · 5MB 이하<input id="login-pdf" type="file" accept="application/pdf,.pdf"></label><button id="ocr-button" class="blue">PDF 분석</button><button id="manual-account">직접 입력</button><div id="import-area"></div></section><section class="panel"><h2>현재 학생 ${data.students.length}명</h2><div class="tablewrap"><table><thead><tr><th>번호</th><th>닉네임</th><th>학생 코드</th><th>GOLD</th></tr></thead><tbody>${data.students.map(u=>'<tr><td>'+u.number+'</td><td>'+esc(u.name)+'</td><td>'+esc(u.code)+'</td><td>'+fmt(u.balance)+'</td></tr>').join('')}</tbody></table></div><h3 style="margin-top:20px">아바타 일괄 등록</h3><p class="muted">설치 파일의 private-assets/avatar-bundle.json을 선택하세요. 학생 번호로 연결합니다.</p><input id="avatar-bundle" type="file" accept="application/json,.json"><div class="actions"><button id="avatar-upload" data-mutate>아바타 적용</button></div></section>`;}
if(view==='gold'){html=title('GOLD 관리','양수는 지급, 음수는 차감입니다. 묶인 GOLD는 차감할 수 없습니다.')+`<form id="gold-form" class="panel" style="margin-top:20px"><label>변경 사유<input name="reason" required maxlength="200" placeholder="예: 기존 학급 화폐 초기 잔액 등록"></label><div class="tablewrap"><table><thead><tr><th>학생</th><th>현재 / 묶임</th><th>변경량 · GOLD</th></tr></thead><tbody>${data.students.map(u=>'<tr><td>'+u.number+'번 '+esc(u.name)+'</td><td>'+fmt(u.balance)+' / '+fmt(u.held)+'</td><td><input aria-label="'+u.number+'번 GOLD 변경량" type="number" step="1" min="-100000000" max="100000000" value="0" data-gold="'+esc(u.id)+'"></td></tr>').join('')}</tbody></table></div><div class="actions"><button type="submit" class="blue" data-mutate>GOLD 변경 적용</button></div></form>`+ledger();}
if(view==='wallet'){html=title('내 GOLD','최근 200건의 거래를 보여 줍니다.')+`<section class="wallet"><div><span>사용 가능한 GOLD</span><div class="big">${fmt(data.me.balance-data.me.held)} GOLD</div></div><div class="walletstat">보유<b>${fmt(data.me.balance)}</b></div><div class="walletstat">묶임<b>${fmt(data.me.held)}</b></div></section>`+ledger();}
if(view==='coupons'){html=title(teacher?'쿠폰 관리':'내 쿠폰함',teacher?'사용 요청을 확인하고 승인하거나 반려하세요.':'쿠폰을 사용할 때 선생님께 요청하세요.')+'<section class="panel" style="margin-top:20px">'+(data.coupons.slice().reverse().map(c=>{let expired=Date.now()+offset>=c.expiry;return `<div class="line"><div class="row"><div><span class="tag">${c.status==='used'?'사용 완료':expired?'기한 만료':c.status==='requested'?'승인 대기':'미사용'}</span><h3>🎟 ${esc(c.title)}</h3><p class="muted">${teacher?esc(c.name)+' · ':''}${time(c.expiry)}까지</p><p style="white-space:pre-wrap">${esc(c.description)}</p></div><div class="actions">${teacher&&c.status==='requested'?`<button data-coupon="${esc(c.id)}" data-approve="false" data-mutate>반려</button>${!expired?`<button class="blue" data-coupon="${esc(c.id)}" data-approve="true" data-mutate>사용 승인</button>`:''}`:!teacher&&c.status==='unused'&&!expired?`<button data-request="${esc(c.id)}" class="blue" data-mutate>사용 요청</button>`:''}</div></div></div>`;}).join('')||'<p>아직 쿠폰이 없습니다.</p>')+'</section>';}
if(view==='history'){html=title('내 참여 기록','최종 입찰과 낙찰 결과를 확인해요.')+'<section class="panel" style="margin-top:20px">'+(data.auctions.filter(a=>a.mine>0).map(a=>'<div class="line row"><div><h3>'+esc(a.title)+'</h3><span class="muted">'+labelStatus(a)+' · '+(a.status==='closed'?(a.winner?'낙찰: '+esc(a.winner):'유찰'):'입찰 중')+'</span></div><b>'+fmt(a.mine)+' GOLD</b></div>').join('')||'참여 기록이 없습니다.')+'</section>';}
if(view==='settings'){html=title('교사 설정 · 백업','비밀번호 변경 시 기존 교사 로그인이 모두 만료됩니다.')+`<form id="password-form" class="panel" style="margin-top:20px"><h2>교사 비밀번호 변경</h2><div class="formgrid"><label>현재 비밀번호<input name="current" type="password" required autocomplete="current-password"></label><label>새 비밀번호 · 12~128자<input name="next" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label><label class="full">새 비밀번호 확인<input name="repeat" type="password" minlength="12" maxlength="128" required autocomplete="new-password"></label></div><div class="actions"><button type="submit" data-mutate class="blue">비밀번호 변경</button></div></form><section class="panel"><h2>학급 데이터 백업</h2><p>학생 계정 해시, 경매, GOLD 거래, 쿠폰 기록을 내려받습니다.</p><p class="muted">이미지 파일은 별도 Drive 폴더에 있습니다. 백업은 비공개로 보관하세요.</p><div class="actions"><button id="backup">JSON 백업 다운로드</button></div></section><section class="panel"><h2>최근 교사 작업</h2>${data.audit.map(x=>'<div class="line"><b>'+esc(x.detail)+'</b><div class="muted">'+time(x.at)+'</div></div>').join('')||'기록이 없습니다.'}</section>`;}
$('#main').innerHTML=html;bind();loadImages();tick();}
function ledger(){return '<section class="panel"><h2>최근 GOLD 거래</h2>'+ (data.ledger.map(l=>'<div class="line row"><div><b>'+esc(l.reason)+'</b><div class="muted">'+esc(l.name)+' · '+time(l.at)+'</div></div><strong>'+(l.amount>0?'+':'')+fmt(l.amount)+' GOLD</strong></div>').join('')||'거래 내역이 없습니다.')+'</section>';}
function product(a){const teacher=data.role==='teacher',active=a.status==='open'&&a.start<=Date.now()+offset&&a.end>Date.now()+offset;return `<article class="product"><div class="art">${a.image?'<img data-image="'+esc(a.image)+'" alt="'+esc(a.title)+'">':a.title.includes('급식')?'🍽':a.title.includes('숙제')?'📖':'🎁'}</div><div class="row"><span class="tag ${a.mode==='public'?'green':''}">${a.mode==='public'?'공개 경매':'비공개 경매'}</span><span class="muted">${labelStatus(a)}</span></div><h2 style="margin:12px 0 7px">${esc(a.title)}</h2><p class="desc">${esc(a.description)}</p><div class="muted" style="margin-top:12px">${a.status==='closed'?'낙찰 금액':a.mode==='sealed'?'내 입찰 금액':'현재 최고 금액'}</div><div class="amount">${a.status==='closed'?fmt(a.price):a.mode==='sealed'?teacher?'비공개':fmt(a.mine):fmt(a.highest||a.minimum)} ${a.mode==='sealed'&&teacher&&a.status!=='closed'?'':'GOLD'}</div>${a.status==='closed'?'<p class="muted">'+(a.winner?'낙찰자: '+esc(a.winner):'입찰 없이 종료되었습니다.')+'</p>':a.mode==='public'&&a.leader?'<p class="muted">최고 입찰자: '+esc(a.leader)+'</p>':''}${a.status==='open'?'<span class="timer" data-start="'+a.start+'" data-end="'+a.end+'"></span>':''}<p class="muted">시작 ${fmt(a.minimum)} GOLD · 단위 ${fmt(a.step)} GOLD${teacher?' · 참여 '+a.participants+'명':''}</p><div class="actions">${teacher?(a.status==='draft'?'<button class="blue" data-start-auction="'+a.id+'" data-mutate>지금 시작</button>':'')+(['open','draft'].includes(a.status)?'<button class="danger" data-cancel="'+a.id+'" data-mutate>취소</button>':''):active?'<button class="blue" data-bid="'+a.id+'">'+(a.mine?'입찰 수정':'입찰하기')+'</button>':''}</div></article>`;}
function confirmAction(text,fn){$('#confirm-title').textContent='내용을 확인해 주세요';$('#confirm-text').textContent=text;$('#confirm-yes').onclick=()=>{$('#confirm').close();fn();};$('#confirm').showModal();}
$('#confirm-no').onclick=()=>$('#confirm').close();
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(busy)return;view=b.dataset.nav;render();});if($('#refresh'))$('#refresh').onclick=()=>refresh();
document.querySelectorAll('[data-start-auction]').forEach(b=>b.onclick=()=>confirmAction('지금부터 경매를 시작할까요?',()=>mutate('start',{id:b.dataset.startAuction})));
document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{const reason=prompt('경매 취소 사유를 입력하세요. 묶인 GOLD는 모두 해제됩니다.');if(reason)mutate('cancel',{id:b.dataset.cancel,reason});});
document.querySelectorAll('[data-bid]').forEach(b=>b.onclick=()=>bidDialog(b.dataset.bid));
document.querySelectorAll('[data-request]').forEach(b=>b.onclick=()=>confirmAction('선생님께 이 쿠폰의 사용을 요청할까요?',()=>mutate('requestCoupon',{id:b.dataset.request})));
document.querySelectorAll('[data-coupon]').forEach(b=>b.onclick=()=>mutate('coupon',{id:b.dataset.coupon,approve:b.dataset.approve==='true'}));
if($('#create-form')){$('#reward').onchange=e=>$('#reward-name').value=e.target.value==='직접 입력'?'':e.target.value;$('#timing').onchange=e=>{$('#duration').hidden=e.target.value!=='duration';$('#schedule').hidden=e.target.value!=='scheduled';document.querySelectorAll('#schedule input').forEach(i=>i.required=e.target.value==='scheduled');};$('#create-form').onsubmit=async e=>{e.preventDefault();if(busy)return;const f=new FormData(e.target),p=Object.fromEntries(f);p.allowed=f.getAll('allowed');p.start=p.start?new Date(p.start+':00+09:00').getTime():0;p.end=p.end?new Date(p.end+':00+09:00').getTime():0;try{if($('#coupon-image').files[0])p.imageData=await imageData($('#coupon-image').files[0]);confirmAction(p.title+' 경매를 등록할까요?',async()=>{const ok=await mutate('create',p);if(ok){view='manage';render();}});}catch(err){message(err.message,true);}};}
if($('#gold-form'))$('#gold-form').onsubmit=e=>{e.preventDefault();const rows=Array.from(document.querySelectorAll('[data-gold]')).filter(i=>Number(i.value)!==0).map(i=>({id:i.dataset.gold,amount:Number(i.value)}));if(!rows.length)return message('변경할 GOLD를 입력하세요.',true);const reason=new FormData(e.target).get('reason');confirmAction(rows.length+'명의 GOLD를 변경할까요?',()=>mutate('gold',{rows,reason}));};
if($('#password-form'))$('#password-form').onsubmit=e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));if(p.next!==p.repeat)return message('새 비밀번호 확인이 일치하지 않습니다.',true);confirmAction('교사 비밀번호를 변경하고 다시 로그인할까요?',async()=>{if(await mutate('password',p)){signoutLocal();loginRole='teacher';showLogin();message('비밀번호가 변경되었습니다. 새 비밀번호로 로그인하세요.');}});};
if($('#backup'))$('#backup').onclick=async()=>{try{download('gold-backup-'+new Date().toISOString().slice(0,10)+'.json',await call('backup'));}catch(e){message(e.message,true);}};
if($('#ocr-button')){$('#ocr-button').onclick=async()=>{const f=$('#login-pdf').files[0];if(!f)return message('PDF를 선택하세요.',true);if(f.size>5000000)return message('PDF는 5MB 이하로 선택하세요.',true);if(busy)return;working(true);try{const result=await call('pdf',{data:(await readFile(f)).split(',')[1]});importRows=result.rows;drawImport(result.text);message(result.warning);}catch(e){message(e.message,true);}finally{working(false);}};$('#manual-account').onclick=()=>{importRows=[{number:'',name:'',code:'',pin:''}];drawImport('');};$('#avatar-upload').onclick=async()=>{const f=$('#avatar-bundle').files[0];if(!f)return message('아바타 JSON 파일을 선택하세요.',true);if(f.size>8000000)return message('아바타 파일이 너무 큽니다.',true);try{const rows=JSON.parse(await f.text());confirmAction(rows.length+'명의 아바타를 적용할까요?',()=>mutate('avatars',{rows}));}catch(e){message(e.message,true);}};}}
function bidDialog(id){const a=data.auctions.find(x=>x.id===id),min=a.mode==='public'?(a.highest?a.highest+a.step:a.minimum):a.minimum;$('#confirm-title').textContent=a.title;$('#confirm-text').innerHTML='<label>입찰 금액 · GOLD<input id="bid-amount" type="number" min="'+min+'" step="'+a.step+'" value="'+(a.mode==='sealed'&&a.mine?a.mine:min)+'"></label><p class="muted">최소 '+fmt(min)+' GOLD · 단위 '+a.step+' GOLD<br>낙찰 시 입력한 금액이 차감됩니다.</p>'+(a.mode==='sealed'&&a.mine?'<button id="withdraw" class="danger">입찰 철회</button>':'');$('#confirm-yes').textContent='입찰 확정';$('#confirm-yes').onclick=()=>{const n=Number($('#bid-amount').value);if(!$('#bid-amount').reportValidity())return;$('#confirm').close();mutate('bid',{auction:id,amount:n});};if($('#withdraw'))$('#withdraw').onclick=()=>{$('#confirm').close();mutate('bid',{auction:id,amount:0});};$('#confirm').showModal();}
$('#confirm').addEventListener('close',()=>{$('#confirm-yes').textContent='확인';});
function drawImport(text){$('#import-area').innerHTML='<p class="notice">번호, 아이디, PIN을 원본 PDF와 반드시 대조하세요. 확인 체크한 행만 적용됩니다. 신규 학생의 GOLD는 0으로 시작합니다.</p><div class="tablewrap"><table><thead><tr><th>확인</th><th>번호</th><th>닉네임</th><th>아이디</th><th>PIN</th><th>처리</th></tr></thead><tbody id="import-body"></tbody></table></div><div class="actions"><button id="add-row">행 추가</button><button id="apply-accounts" class="blue" data-mutate>확인한 계정 적용</button></div><details><summary>OCR 원문 보기</summary><pre id="ocr-text" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></details>';$('#ocr-text').textContent=text;importRows.forEach(addImportRow);$('#add-row').onclick=()=>addImportRow({number:'',name:'',code:'',pin:''});$('#apply-accounts').onclick=()=>{const rows=Array.from(document.querySelectorAll('#import-body tr')).filter(tr=>tr.querySelector('[data-field=checked]').checked).map(tr=>Object.fromEntries(['number','name','code','pin'].map(k=>[k,tr.querySelector('[data-field='+k+']').value])));if(!rows.length)return message('원본과 대조한 행의 확인란을 선택하세요.',true);confirmAction(rows.length+'명의 로그인 정보를 적용할까요? 변경된 학생은 다시 로그인해야 합니다.',()=>mutate('accounts',{rows}));};}
function addImportRow(r){const existing=data.students.find(u=>u.number===Number(r.number)),tr=document.createElement('tr');tr.innerHTML='<td><input type="checkbox" data-field="checked" aria-label="원본 대조 완료"></td>'+['number','name','code','pin'].map(k=>'<td><input data-field="'+k+'" aria-label="'+k+'" type="'+(k==='number'?'number':k==='pin'?'password':'text')+'" value="'+esc(k==='name'&&existing?existing.name:r[k]||'')+'" '+(k==='pin'?'autocomplete="new-password"':'')+'></td>').join('')+'<td><span>'+(!r.number?'번호 확인':existing?'변경':'신규')+'</span><button type="button" class="remove-row">제외</button></td>';$('#import-body').append(tr);tr.querySelector('.remove-row').onclick=()=>tr.remove();tr.querySelector('[data-field=number]').onchange=e=>{const u=data.students.find(x=>x.number===Number(e.target.value));tr.querySelector('td:last-child span').textContent=u?'변경':'신규';if(u)tr.querySelector('[data-field=name]').value=u.name;};}
function readFile(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('파일을 읽지 못했습니다.'));r.readAsDataURL(f);});}
async function imageData(f){if(!['image/png','image/jpeg','image/webp'].includes(f.type))throw Error('PNG/JPG/WebP 이미지를 선택하세요.');if(f.size>500000)throw Error('쿠폰 이미지는 500KB 이하로 줄여 주세요.');return readFile(f);}
async function loadImages(){const imgs=Array.from(document.querySelectorAll('[data-image]'));for(const img of imgs){const id=img.dataset.image;try{if(!imageCache[id])imageCache[id]=await call('image',{id});if(img.isConnected)img.src=imageCache[id];}catch(e){img.alt='이미지를 불러오지 못했습니다.';}}}
function tick(){document.querySelectorAll('[data-end]').forEach(el=>{const now=Date.now()+offset,start=Number(el.dataset.start),end=Number(el.dataset.end);if(now<start)el.textContent=time(start)+' 시작';else if(now>=end)el.textContent='마감 · 결과 확인 중';else{const n=Math.ceil((end-now)/1000);el.textContent='◷ '+Math.floor(n/60)+':'+String(n%60).padStart(2,'0')+' 남음';}});}
function download(name,txt){const url=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
$('#logout').onclick=async()=>{try{await call('logout');}finally{signoutLocal();}};
setInterval(tick,1000);setTimeout(()=>{pollTimer=setInterval(()=>{if(!document.hidden&&token&&!busy&&!$('#confirm').open&&['market','manage','wallet','coupons','history','screen'].includes(view))refresh();},20000);},Math.random()*4000);
if(token)refresh();else showLogin();
</script></body></html>
